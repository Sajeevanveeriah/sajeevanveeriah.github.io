<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Know when to brake.</title><desc id="desc">Treat sensing quality and execution timing as one recovery problem. RESEARCH ARCHITECTURE / Simulation results do not establish physical-robot safety.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#215ad2" stroke-width="1.5"/></marker></defs><rect width="1200" height="720" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="56" y="56" font-size="16" fill="#215ad2" font-weight="600">INDEPENDENT RESEARCH / RUNTIME ASSURANCE</text><text x="56" y="113" font-size="42" fill="#17212b" font-weight="600">Know when to brake.</text><text x="56" y="151" font-size="22" fill="#56616d" font-weight="400">Treat sensing quality and execution timing as one recovery problem.</text><path d="M56 184H1144" fill="none" stroke="#cbd5df" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="236" width="420" height="90" rx="8" fill="#fff" stroke="#cbd5df" stroke-width="2"/><text x="76" y="270" font-size="25" fill="#17212b" font-weight="600">Observation age + uncertainty</text><text x="76" y="301" font-size="19" fill="#56616d" font-weight="400">Timestamped position and command history</text><path d="M478 280 L620 280" stroke="#215ad2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="635" y="236" width="509" height="90" rx="8" fill="#fff" stroke="#cbd5df" stroke-width="2"/><text x="655" y="270" font-size="25" fill="#17212b" font-weight="600">Recovery certificate</text><text x="655" y="301" font-size="19" fill="#56616d" font-weight="400">Clearance / response delay / braking</text><path d="M890 331V385H330V419" fill="none" stroke="#215ad2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M890 385V419" fill="none" stroke="#215ad2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="90" y="430" width="455" height="90" rx="8" fill="#fff" stroke="#cbd5df" stroke-width="2"/><text x="110" y="464" font-size="25" fill="#17212b" font-weight="600">Continue / restrict</text><text x="110" y="495" font-size="19" fill="#56616d" font-weight="400">Keep a feasible recovery manoeuvre</text><rect x="635" y="430" width="509" height="90" rx="8" fill="#fff" stroke="#cbd5df" stroke-width="2"/><text x="655" y="464" font-size="25" fill="#17212b" font-weight="600">Recover</text><text x="655" y="495" font-size="19" fill="#56616d" font-weight="400">Command lease + braking watchdog</text><text x="92" y="596" font-size="22" fill="#56616d" font-weight="400">Static obstacles</text><text x="380" y="596" font-size="22" fill="#56616d" font-weight="400">Reduced-order model</text><text x="790" y="596" font-size="22" fill="#56616d" font-weight="400">Beyond-bound tests</text><path d="M56 650H1144" fill="none" stroke="#cbd5df" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="686" font-size="17" fill="#56616d" font-weight="400">RESEARCH ARCHITECTURE / Simulation results do not establish physical-robot safety.</text></g></svg>