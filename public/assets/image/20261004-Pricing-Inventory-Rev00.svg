<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Review before import.</title><desc id="desc">Supplier data becomes an auditable decision, then a controlled output. WORKFLOW DIAGRAM / Illustrates application behaviour, not live client data.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#215ad2" stroke-width="1.5"/></marker></defs><rect width="1200" height="720" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="56" y="56" font-size="16" fill="#215ad2" font-weight="600">SOFTWARE / CLIENT WORKFLOW</text><text x="56" y="113" font-size="42" fill="#17212b" font-weight="600">Review before import.</text><text x="56" y="151" font-size="22" fill="#56616d" font-weight="400">Supplier data becomes an auditable decision, then a controlled output.</text><path d="M56 184H1144" fill="none" stroke="#cbd5df" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="240" width="340" height="90" rx="8" fill="#fff" stroke="#cbd5df" stroke-width="2"/><text x="76" y="274" font-size="25" fill="#17212b" font-weight="600">Supplier export</text><text x="76" y="305" font-size="19" fill="#56616d" font-weight="400">Preserve identifiers</text><rect x="430" y="240" width="340" height="90" rx="8" fill="#fff" stroke="#cbd5df" stroke-width="2"/><text x="450" y="274" font-size="25" fill="#17212b" font-weight="600">Compare + price</text><text x="450" y="305" font-size="19" fill="#56616d" font-weight="400">Exact rules and money</text><rect x="804" y="240" width="340" height="90" rx="8" fill="#fff" stroke="#cbd5df" stroke-width="2"/><text x="824" y="274" font-size="25" fill="#17212b" font-weight="600">Operator review</text><text x="824" y="305" font-size="19" fill="#56616d" font-weight="400">Approve or hold</text><path d="M398 285 L422 285" stroke="#215ad2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M772 285 L796 285" stroke="#215ad2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M974 335V380H610V426" fill="none" stroke="#215ad2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="430" y="435" width="340" height="90" rx="8" fill="#fff" stroke="#cbd5df" stroke-width="2"/><text x="450" y="469" font-size="25" fill="#17212b" font-weight="600">ServiceM8 import</text><text x="450" y="500" font-size="19" fill="#56616d" font-weight="400">Reviewed catalogue changes</text><rect x="56" y="425" width="300" height="150" rx="8" fill="#e9effb" stroke="#cbd5df" stroke-width="2"/><text x="78" y="465" font-size="23" fill="#17212b" font-weight="600">Exceptions stay visible</text><text x="78" y="506" font-size="21" fill="#56616d" font-weight="400">No guessed matches.</text><text x="78" y="541" font-size="21" fill="#56616d" font-weight="400">No silent deletions.</text><rect x="844" y="425" width="300" height="150" rx="8" fill="#eaf3f1" stroke="#cbd5df" stroke-width="2"/><text x="866" y="465" font-size="23" fill="#17212b" font-weight="600">Keep a recovery trail</text><text x="866" y="506" font-size="21" fill="#56616d" font-weight="400">Change + audit reports</text><text x="866" y="541" font-size="21" fill="#56616d" font-weight="400">Rollback output</text><path d="M56 650H1144" fill="none" stroke="#cbd5df" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="686" font-size="17" fill="#56616d" font-weight="400">WORKFLOW DIAGRAM / Illustrates application behaviour, not live client data.</text></g></svg>