<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1220" viewBox="0 0 600 1220" role="img" aria-labelledby="title desc"><title id="title">Proposed outdoor network topology - compact view</title><desc id="desc">Gateway feeds LAN, with separate wired branches to Omada controller, optional indoor AP and root AP. Wireless backhaul links root and separately powered remote AP. Concept only.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#215ad2" stroke-width="1.5"/></marker></defs><rect width="600" height="1220" fill="#f0f3f6"/><g font-family="Arial, Helvetica, sans-serif" fill="#17212b"><text x="32" y="55" font-size="34" fill="#17212b" font-weight="700">Outdoor network plan</text><text x="32" y="97" font-size="28" fill="#56616d" font-weight="400">Conceptual two-AP pilot</text><rect x="32" y="132" width="536" height="108" rx="16" fill="#fff" stroke="#b9c4cf"/><text x="56" y="174" font-size="30" fill="#17212b" font-weight="600">Existing internet gateway</text><text x="56" y="209" font-size="23" fill="#56616d" font-weight="400">Retain the working connection</text><path d="M300 240V274" fill="none" stroke="#215ad2" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="284" width="536" height="108" rx="16" fill="#fff" stroke="#b9c4cf"/><text x="56" y="326" font-size="30" fill="#17212b" font-weight="600">LAN ports or switch</text><text x="56" y="361" font-size="23" fill="#56616d" font-weight="400">Switch only if required</text><path d="M300 392V414H16V780" fill="none" stroke="#215ad2" stroke-width="3"/><path d="M16 490H29 M16 634H29 M16 780H29" fill="none" stroke="#215ad2" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="440" width="536" height="108" rx="16" fill="#fff" stroke="#b9c4cf"/><text x="56" y="482" font-size="30" fill="#17212b" font-weight="600">Omada controller</text><text x="56" y="517" font-size="23" fill="#56616d" font-weight="400">Wired branch: existing PC or OC200</text><rect x="32" y="584" width="536" height="108" rx="16" fill="#fff" stroke="#b9c4cf"/><text x="56" y="626" font-size="30" fill="#17212b" font-weight="600">Optional indoor AP</text><text x="56" y="661" font-size="23" fill="#56616d" font-weight="400">Wired branch: compatible reused router</text><rect x="32" y="728" width="536" height="108" rx="16" fill="#fff" stroke="#b9c4cf"/><text x="56" y="770" font-size="30" fill="#17212b" font-weight="600">Root outdoor AP</text><text x="56" y="805" font-size="23" fill="#56616d" font-weight="400">Wired branch: Ethernet + PoE injector</text><path d="M300 836V914" fill="none" stroke="#215ad2" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow)"/><text x="328" y="876" font-size="25" fill="#215ad2" font-weight="400">Wireless</text><text x="328" y="904" font-size="25" fill="#215ad2" font-weight="400">backhaul</text><rect x="32" y="930" width="536" height="108" rx="16" fill="#fff" stroke="#b9c4cf"/><text x="56" y="972" font-size="30" fill="#17212b" font-weight="600">Remote outdoor AP</text><text x="56" y="1007" font-size="23" fill="#56616d" font-weight="400">Separate local power + injector</text><text x="32" y="1093" font-size="27" fill="#56616d" font-weight="400">All wired branches connect to the LAN.</text><text x="32" y="1145" font-size="27" fill="#56616d" font-weight="400">Topology only. Locations, coverage and</text><text x="32" y="1181" font-size="27" fill="#56616d" font-weight="400">installed equipment require verification.</text></g></svg>