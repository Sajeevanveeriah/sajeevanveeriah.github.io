<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Proposed outdoor network topology</title><desc id="desc">Gateway to LAN. LAN branches to controller, wired root AP and optional indoor AP. Wireless backhaul joins root to remote AP, with separate local power. Proposed design, not installed topology.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#215ad2" stroke-width="1.5"/></marker></defs><rect width="1200" height="850" fill="#f0f3f6"/><g font-family="Arial, Helvetica, sans-serif" fill="#17212b"><text x="48" y="65" font-size="38" fill="#17212b" font-weight="700">Outdoor network expansion</text><text x="48" y="106" font-size="25" fill="#56616d" font-weight="400">Conceptual two-AP pilot | September 2026 design</text><rect x="398" y="150" width="405" height="106" rx="16" fill="#fff" stroke="#b9c4cf"/><text x="422" y="192" font-size="27" fill="#17212b" font-weight="600">Existing internet gateway</text><text x="422" y="227" font-size="23" fill="#56616d" font-weight="400">Retain the working connection</text><path d="M600 256V302" fill="none" stroke="#215ad2" stroke-width="3" marker-end="url(#arrow)"/><rect x="398" y="310" width="405" height="96" rx="16" fill="#fff" stroke="#b9c4cf"/><text x="422" y="352" font-size="27" fill="#17212b" font-weight="600">LAN ports or switch</text><text x="422" y="387" font-size="23" fill="#56616d" font-weight="400">Switch only if required</text><path d="M450 406V440H207V470" fill="none" stroke="#215ad2" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 406V470" fill="none" stroke="#215ad2" stroke-width="3" marker-end="url(#arrow)"/><path d="M750 406V440H996V470" fill="none" stroke="#215ad2" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="480" width="330" height="116" rx="16" fill="#fff" stroke="#b9c4cf"/><text x="66" y="522" font-size="25" fill="#17212b" font-weight="600">Omada controller</text><text x="66" y="557" font-size="23" fill="#56616d" font-weight="400">Computer / OC200 option</text><rect x="410" y="480" width="380" height="116" rx="16" fill="#fff" stroke="#b9c4cf"/><text x="434" y="522" font-size="27" fill="#17212b" font-weight="600">Root outdoor AP</text><text x="434" y="557" font-size="23" fill="#56616d" font-weight="400">Ethernet + its PoE injector</text><rect x="830" y="480" width="328" height="116" rx="16" fill="#fff" stroke="#b9c4cf"/><text x="854" y="522" font-size="25" fill="#17212b" font-weight="600">Optional indoor AP</text><text x="854" y="557" font-size="23" fill="#56616d" font-weight="400">Reused indoor router</text><path d="M600 596V670" fill="none" stroke="#215ad2" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow)"/><text x="632" y="642" font-size="24" fill="#215ad2" font-weight="400">Wireless backhaul</text><rect x="410" y="680" width="380" height="108" rx="16" fill="#fff" stroke="#b9c4cf"/><text x="434" y="722" font-size="25" fill="#17212b" font-weight="600">Remote outdoor AP</text><text x="434" y="757" font-size="23" fill="#56616d" font-weight="400">Local power + own injector</text><text x="48" y="829" font-size="24" fill="#56616d" font-weight="400">Topology only. Positions, coverage and installed equipment are not established by this map.</text></g></svg>