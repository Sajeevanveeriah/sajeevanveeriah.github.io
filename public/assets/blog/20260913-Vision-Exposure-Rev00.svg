<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">The exposure budget</title><desc id="desc">Illustrative calculation. At 1000 mm/s and 0.1 mm per pixel, 100 microseconds produces 1 pixel of projected travel; 500 microseconds produces 5 pixels. Feature width is 2 pixels.</desc><rect width="1200" height="720" fill="#f7f8fa"/><g font-family="DejaVu Sans, sans-serif"><text x="64" y="65" font-size="18" fill="#1c5594" font-weight="600">MACHINE VISION / IMAGE FORMATION</text><text x="64" y="130" font-size="52" fill="#17212b" font-weight="600">The exposure budget</text><text x="64" y="180" font-size="24" fill="#17212b" font-weight="400">1 m/s motion  ·  0.1 mm per pixel  ·  0.2 mm feature</text><text x="64" y="248" font-size="18" fill="#45566a" font-weight="600">PROJECTED DISTANCE</text><path d="M460 268V542" stroke="#d4dae1"/><text x="456" y="577" font-size="21" fill="#45566a" font-weight="400">0</text><path d="M558 268V542" stroke="#d4dae1"/><text x="554" y="577" font-size="21" fill="#45566a" font-weight="400">1</text><path d="M656 268V542" stroke="#d4dae1"/><text x="652" y="577" font-size="21" fill="#45566a" font-weight="400">2</text><path d="M754 268V542" stroke="#d4dae1"/><text x="750" y="577" font-size="21" fill="#45566a" font-weight="400">3</text><path d="M852 268V542" stroke="#d4dae1"/><text x="848" y="577" font-size="21" fill="#45566a" font-weight="400">4</text><path d="M950 268V542" stroke="#d4dae1"/><text x="946" y="577" font-size="21" fill="#45566a" font-weight="400">5</text><path d="M1048 268V542" stroke="#d4dae1"/><text x="1044" y="577" font-size="21" fill="#45566a" font-weight="400">6</text><text x="1030" y="608" font-size="20" fill="#45566a" font-weight="400">pixels</text><text x="64" y="327" font-size="26" fill="#17212b" font-weight="600">Feature width</text><rect x="460" y="300" width="196" height="42" rx="3" fill="#17212b"/><text x="674" y="330" font-size="24" fill="#17212b" font-weight="600">2 px</text><text x="64" y="420" font-size="26" fill="#17212b" font-weight="600">100 µs exposure</text><rect x="460" y="393" width="98" height="42" rx="3" fill="#1c5594"/><text x="576" y="423" font-size="24" fill="#1c5594" font-weight="600">1 px</text><text x="64" y="513" font-size="26" fill="#17212b" font-weight="600">500 µs exposure</text><rect x="460" y="486" width="490" height="42" rx="3" fill="#9e4526"/><text x="968" y="516" font-size="24" fill="#9e4526" font-weight="600">5 px</text><path d="M64 638H1136" stroke="#a7b2bf"/><text x="64" y="679" font-size="18" fill="#17212b" font-weight="600">SAJEEVAN VEERIAH</text><text x="755" y="679" font-size="17" fill="#17212b" font-weight="400">ENGINEERING NOTES / 13 SEP 2026</text></g></svg>