<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">The experience trap</title><desc id="desc">A closed loop between needing experience and needing a role. Paid supervised work provides a route out.</desc><rect width="1200" height="720" fill="#101820"/><g font-family="DejaVu Sans,sans-serif" fill="#f3f5f7"><text x="70" y="80" font-size="20" fill="#8eddd1" letter-spacing="3">HIRING / OPPORTUNITY</text><text x="70" y="153" font-size="54" font-weight="700">The experience trap</text><text x="70" y="199" font-size="23" fill="#c7d0d8">Who provides the first credible opportunity?</text><rect x="70" y="267" width="460" height="140" rx="12" fill="#23323e"/><rect x="670" y="267" width="460" height="140" rx="12" fill="#23323e"/><text x="105" y="327" font-size="30" font-weight="700">Need experience</text><text x="105" y="368" font-size="23" fill="#c7d0d8">to get a role</text><text x="705" y="327" font-size="30" font-weight="700">Need a role</text><text x="705" y="368" font-size="23" fill="#c7d0d8">to gain experience</text><path d="M545 315H653l-14-9m14 9-14 9M655 369H547l14-9m-14 9 14 9" stroke="#f3f5f7" stroke-width="3" fill="none"/><path d="M600 400V472l-9-14m9 14 9-14" stroke="#8eddd1" stroke-width="3" fill="none"/><rect x="70" y="498" width="1060" height="123" rx="12" fill="#8eddd1"/><text x="102" y="548" font-size="29" font-weight="700" fill="#101820">Create an entry route</text><text x="102" y="587" font-size="23" fill="#101820">Assess capability. Offer paid work with supervision.</text><text x="70" y="674" font-size="18" fill="#c7d0d8">Conceptual model / The experience trap / Sajeevan Veeriah</text></g></svg>