<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">What should hiring assess?</title><desc id="desc">Work samples, learning and verification are assessed alongside genuine prerequisites. Supervision supports increasing responsibility.</desc><rect width="1200" height="720" fill="#101820"/><g font-family="DejaVu Sans,sans-serif" fill="#f3f5f7"><text x="70" y="80" font-size="20" fill="#8eddd1" letter-spacing="3">A PROPOSED ASSESSMENT</text><text x="70" y="153" font-size="48" font-weight="700">What can this person demonstrate?</text><text x="70" y="199" font-size="23" fill="#c7d0d8">Use the same relevant criteria for every candidate.</text><path d="M70 239H1130M70 337H1130M70 435H1130M70 533H1130" stroke="#526372"/><text x="70" y="281" font-size="25" font-weight="700">01 / Work sample</text><text x="480" y="281" font-size="24">Explain a decision and its constraints.</text><text x="480" y="315" font-size="20" fill="#c7d0d8">Inspect the actual work and its limits.</text><text x="70" y="379" font-size="25" font-weight="700">02 / Learning</text><text x="480" y="379" font-size="24">Show how an unfamiliar problem was tackled.</text><text x="480" y="413" font-size="20" fill="#c7d0d8">Discuss feedback and what changed.</text><text x="70" y="477" font-size="25" font-weight="700">03 / Verification</text><text x="480" y="477" font-size="24">Test the result. Recognise uncertainty.</text><text x="480" y="511" font-size="20" fill="#c7d0d8">Explain checks on AI-assisted work too.</text><text x="70" y="583" font-size="25" font-weight="700" fill="#8eddd1">Then provide supervised responsibility.</text><text x="70" y="622" font-size="22" fill="#c7d0d8">Retain genuine safety, licensing and role prerequisites.</text><text x="70" y="674" font-size="18" fill="#c7d0d8">Conceptual proposal / No scoring weights or measured outcomes implied</text></g></svg>