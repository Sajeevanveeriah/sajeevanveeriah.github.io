<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Same intention. Same operation ID.</title><desc id="desc">Illustrative sequence under an idempotent API contract.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#215ad2"/></marker></defs><rect width="1200" height="720" fill="#f0f3f6"/><g font-family="Arial, sans-serif"><text x="56" y="65" font-size="38" fill="#17212b" font-weight="600">Same intention. Same operation ID.</text><text x="56" y="110" font-size="23" fill="#56616d" font-weight="400">Illustrative sequence under an idempotent API contract.</text><text x="115" y="188" font-size="30" fill="#17212b" font-weight="600">Caller</text><text x="880" y="188" font-size="30" fill="#17212b" font-weight="600">Receiver</text><path d="M170 220V595 M980 220V595" stroke="#a6b3bf" stroke-width="2"/><path d="M175 265 L970 265" stroke="#215ad2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="340" y="243" font-size="26" fill="#17212b" font-weight="400">Submit operation A</text><text x="815" y="311" font-size="25" fill="#17212b" font-weight="400">Create one job</text><path d="M973 352 L180 352" stroke="#215ad2" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="9 7"/><text x="340" y="333" font-size="26" fill="#17212b" font-weight="400">Reply lost; outcome unknown</text><path d="M175 440 L970 440" stroke="#215ad2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="340" y="418" font-size="26" fill="#17212b" font-weight="400">Retry operation A</text><path d="M973 552 L180 552" stroke="#215ad2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="340" y="530" font-size="26" fill="#17212b" font-weight="400">Return existing result</text><text x="56" y="681" font-size="18" fill="#56616d" font-weight="400">SAJEEVAN VEERIAH  /  ENGINEERING NOTES</text></g></svg>