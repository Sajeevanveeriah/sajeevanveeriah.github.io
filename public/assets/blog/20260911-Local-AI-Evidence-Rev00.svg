<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Evidence and authority are separate.</title><desc id="desc">Proposed boundary for a document assistant.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#215ad2"/></marker></defs><rect width="1200" height="720" fill="#f0f3f6"/><g font-family="Arial, sans-serif"><text x="56" y="65" font-size="38" fill="#17212b" font-weight="600">Evidence and authority are separate.</text><text x="56" y="110" font-size="23" fill="#56616d" font-weight="400">Proposed boundary for a document assistant.</text><rect x="60" y="200" width="300" height="120" rx="8" fill="#fff" stroke="#d7dee5" stroke-width="2"/><text x="84" y="248" font-size="28" fill="#17212b" font-weight="600">Documents</text><text x="84" y="286" font-size="23" fill="#56616d" font-weight="400">Version + provenance</text><rect x="450" y="200" width="300" height="120" rx="8" fill="#fff" stroke="#d7dee5" stroke-width="2"/><text x="474" y="248" font-size="28" fill="#17212b" font-weight="600">Retrieval</text><text x="474" y="286" font-size="23" fill="#56616d" font-weight="400">Inspect the passages</text><rect x="840" y="200" width="300" height="120" rx="8" fill="#fff" stroke="#d7dee5" stroke-width="2"/><text x="864" y="248" font-size="28" fill="#17212b" font-weight="600">Answer</text><text x="864" y="286" font-size="23" fill="#56616d" font-weight="400">Check support</text><path d="M363 260 L445 260" stroke="#215ad2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M753 260 L835 260" stroke="#215ad2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M990 325V392H600V433" stroke="#215ad2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="440" y="440" width="320" height="120" rx="8" fill="#fff" stroke="#d7dee5" stroke-width="2"/><text x="464" y="488" font-size="28" fill="#17212b" font-weight="600">Permission check</text><text x="464" y="526" font-size="23" fill="#56616d" font-weight="400">Enforced by application</text><rect x="840" y="440" width="300" height="120" rx="8" fill="#fff" stroke="#d7dee5" stroke-width="2"/><text x="864" y="488" font-size="28" fill="#17212b" font-weight="600">Allowed action</text><text x="864" y="526" font-size="23" fill="#56616d" font-weight="400">Defined destination</text><path d="M763 500 L835 500" stroke="#215ad2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="60" y="460" font-size="27" fill="#17212b" font-weight="400">Text supplies evidence.</text><text x="60" y="505" font-size="27" fill="#17212b" font-weight="400">It cannot grant access.</text><text x="60" y="597" font-size="26" fill="#17212b" font-weight="400">Also test: missing answers, old documents and injected instructions.</text><text x="56" y="681" font-size="18" fill="#56616d" font-weight="400">SAJEEVAN VEERIAH  /  ENGINEERING NOTES</text></g></svg>