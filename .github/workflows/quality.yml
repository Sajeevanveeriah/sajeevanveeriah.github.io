name: Portfolio quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Generate DOCX resume
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            python-docx==1.2.0 Pillow==12.3.0
          python scripts/generate-public-resume-docx.py

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run rendered portfolio QA
        run: npm run qa:browser

      - name: Upload rendered portfolio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-rendered-qa-${{ github.sha }}
          path: /tmp/portfolio-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Run Lighthouse quality gate
        run: npm run qa:lighthouse

      - name: Verify portfolio export and resume formats
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            index.html \
            404.html \
            .nojekyll \
            BingSiteAuth.xml \
            googlebcce96f6b520ab1f.html \
            robots.txt \
            sitemap.xml \
            favicon.png \
            work/index.html \
            work/autonomous-navigation-rover/index.html \
            work/ataxia-assessment-device/index.html \
            work/swl-pricing-inventory-control/index.html \
            assets/Resume_Sajeevan_Veeriah.pdf \
            assets/Resume_Sajeevan_Veeriah.docx \
            assets/20260903-Robotics-Learning-Roadmap-Rev00.docx \
            assets/image/20260827-Sajeevan-Veeriah-SV-Logo-Rev00.webp; do
            test -s "out/$file" || { echo "missing or empty out/$file"; exit 1; }
          done
          unzip -t out/assets/Resume_Sajeevan_Veeriah.docx >/dev/null
          unzip -t out/assets/20260903-Robotics-Learning-Roadmap-Rev00.docx >/dev/null
          grep -Fq 'Systems that solve real problems.' out/index.html
          grep -Fq 'Download resume' out/index.html
          grep -Fq 'Learn the stack by building through it.' out/index.html
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          path = Path('out/assets/Resume_Sajeevan_Veeriah.docx')
          if path.stat().st_size < 30000:
              raise SystemExit('DOCX resume is unexpectedly small')
          with ZipFile(path) as archive:
              names = set(archive.namelist())
              required_parts = {'[Content_Types].xml', 'word/document.xml', 'word/media/image1.png'}
              missing = required_parts - names
              if missing:
                  raise SystemExit(f'DOCX missing required parts: {sorted(missing)}')
              document = archive.read('word/document.xml').decode('utf-8')
          for phrase in ('Farm Frites Australia', 'CONTRACT PENDING', 'Industrial IT Engineer'):
              if phrase not in document:
                  raise SystemExit(f'DOCX missing required phrase: {phrase}')
          print('DOCX package and Farm Frites content verified')
          PY
          echo 'portfolio export verified'
