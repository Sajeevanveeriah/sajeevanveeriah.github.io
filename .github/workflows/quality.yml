name: Portfolio quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run rendered browser QA
        run: npm run qa:browser

      - name: Upload rendered QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-rendered-qa
          path: /tmp/portfolio-qa
          if-no-files-found: error
          retention-days: 7

      - name: Run Lighthouse quality gate
        run: npm run qa:lighthouse

      - name: Verify export
        run: |
          set -e
          for f in index.html 404.html .nojekyll BingSiteAuth.xml \
                   googlebcce96f6b520ab1f.html robots.txt sitemap.xml favicon.svg; do
            test -e "out/$f" || { echo "missing out/$f"; exit 1; }
          done
          test -e out/assets/Resume_Sajeevan_Veeriah.pdf || { echo "missing resume"; exit 1; }
          echo "export verified"
