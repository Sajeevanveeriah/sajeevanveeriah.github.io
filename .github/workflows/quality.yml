name: Portfolio quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verify static export
        run: npm run qa:export
      - run: npx playwright install --with-deps chromium
      - name: Rendered QA (routes from sitemap, 7 widths, both themes, axe)
        run: npm run qa:browser
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-rendered-qa-${{ github.sha }}
          path: /tmp/portfolio-qa
          if-no-files-found: warn
          retention-days: 14
      - name: Lighthouse gate
        run: npm run qa:lighthouse
      - name: Validate Wrangler deployment
        run: npm run cloudflare:check
      - name: Build GitHub Pages mirror
        run: npm run pages:mirror
