# Builds the static export, deploys it to GitHub Pages and verifies the public portfolio result.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Install browser for rendered QA
        run: npx playwright install --with-deps chromium

      - name: Run portfolio rendered browser QA
        run: npm run qa:browser

      - name: Run Open Industrial Automation browser QA
        run: npm run qa:oia

      - name: Upload pre-deployment QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-deployment-portfolio-and-oia-qa-${{ github.sha }}
          path: |
            /tmp/portfolio-qa
            /tmp/oia-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Run Lighthouse quality gate
        run: npm run qa:lighthouse

      - name: Verify export
        run: |
          set -euo pipefail
          for file in \
            index.html \
            404.html \
            .nojekyll \
            BingSiteAuth.xml \
            googlebcce96f6b520ab1f.html \
            robots.txt \
            sitemap.xml \
            favicon.png \
            open-industrial-automation/index.html \
            open-industrial-automation/styles.css \
            open-industrial-automation/dub.css \
            open-industrial-automation/quality.css \
            open-industrial-automation/release-fixes.css \
            open-industrial-automation/runtime-bootstrap.js \
            open-industrial-automation/data.js \
            open-industrial-automation/app.js \
            open-industrial-automation/quality.js \
            open-industrial-automation/product-shell.js \
            open-industrial-automation/release-fixes.js \
            open-industrial-automation/model.json \
            open-industrial-automation/demo/index.html \
            open-industrial-automation/studio/index.html \
            open-industrial-automation/products/index.html; do
            test -s "out/$file" || { echo "missing or empty out/$file"; exit 1; }
          done
          for product in operations control hmi alarms historian performance integration mes materials assets quality security identity deployment migration; do
            test -s "out/open-industrial-automation/products/$product/index.html" || { echo "missing product route: $product"; exit 1; }
          done
          test -s out/assets/Resume_Sajeevan_Veeriah.pdf || { echo "missing resume"; exit 1; }
          grep -Fq 'Open Industrial Automation Suite' out/open-industrial-automation/index.html
          grep -Fq '../#operations' out/open-industrial-automation/demo/index.html
          grep -Fq '../#control-studio' out/open-industrial-automation/studio/index.html
          grep -Fq 'OIA-REF-001' out/open-industrial-automation/model.json
          grep -Fq 'Machines. Intelligence. Dependable operation.' out/index.html
          echo "export verified"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live-portfolio:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the portfolio, resume and portfolio monogram
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://sajeevanveeriah.github.io"
          for attempt in $(seq 1 90); do
            cache_key="${GITHUB_SHA}-${attempt}"
            portfolio_status="$(curl --silent --show-error --compressed --location \
              --header 'Cache-Control: no-cache' \
              --output /tmp/portfolio-live.html \
              --write-out '%{http_code}' \
              "$base_url/?release=$cache_key")"
            resume_status="$(curl --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --output /tmp/resume-live.pdf \
              --write-out '%{http_code}' \
              "$base_url/assets/Resume_Sajeevan_Veeriah.pdf?release=$cache_key")"
            monogram_status="$(curl --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --output /tmp/portfolio-monogram-live.webp \
              --write-out '%{http_code}' \
              "$base_url/assets/image/20260827-Sajeevan-Veeriah-SV-Logo-Rev00.webp?release=$cache_key")"

            if [ "$portfolio_status" = 200 ] && \
               [ "$resume_status" = 200 ] && \
               [ "$monogram_status" = 200 ] && \
               grep -Fq 'Machines. Intelligence. Dependable operation.' /tmp/portfolio-live.html && \
               cmp --silent public/assets/Resume_Sajeevan_Veeriah.pdf /tmp/resume-live.pdf && \
               cmp --silent public/assets/image/20260827-Sajeevan-Veeriah-SV-Logo-Rev00.webp /tmp/portfolio-monogram-live.webp; then
              printf 'Live portfolio, corrected resume and exact monogram verified after attempt %s\n' "$attempt"
              sha256sum \
                /tmp/portfolio-live.html \
                /tmp/resume-live.pdf \
                /tmp/portfolio-monogram-live.webp
              exit 0
            fi

            printf 'Attempt %s: portfolio=%s resume=%s monogram=%s\n' \
              "$attempt" "$portfolio_status" "$resume_status" "$monogram_status"
            sleep 4
          done
          echo 'The public portfolio files did not match the deployed commit in time' >&2
          exit 1

      - name: Upload live portfolio verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-portfolio-qa-${{ github.sha }}
          path: |
            /tmp/portfolio-live.html
            /tmp/resume-live.pdf
            /tmp/portfolio-monogram-live.webp
          if-no-files-found: warn
          retention-days: 14
