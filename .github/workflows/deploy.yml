# Builds the static export, deploys it to GitHub Pages and verifies the public result.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  OIA_PUBLIC_BASE_URL: https://sajeevanveeriah.github.io/open-industrial-automation

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Install browser for rendered QA
        run: npx playwright install --with-deps chromium

      - name: Run portfolio rendered browser QA
        run: npm run qa:browser

      - name: Run Open Industrial Automation browser QA
        run: npm run qa:oia

      - name: Upload pre-deployment QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-deployment-portfolio-and-oia-qa-${{ github.sha }}
          path: |
            /tmp/portfolio-qa
            /tmp/oia-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Run Lighthouse quality gate
        run: npm run qa:lighthouse

      - name: Verify export
        run: |
          set -euo pipefail
          for file in \
            index.html \
            404.html \
            .nojekyll \
            BingSiteAuth.xml \
            googlebcce96f6b520ab1f.html \
            robots.txt \
            sitemap.xml \
            favicon.png \
            open-industrial-automation/index.html \
            open-industrial-automation/styles.css \
            open-industrial-automation/model.json \
            open-industrial-automation/demo/index.html \
            open-industrial-automation/demo/styles.css \
            open-industrial-automation/demo/app.js \
            open-industrial-automation/studio/index.html \
            open-industrial-automation/studio/styles.css \
            open-industrial-automation/studio/app.js; do
            test -s "out/$file" || { echo "missing or empty out/$file"; exit 1; }
          done
          test -s out/assets/Resume_Sajeevan_Veeriah.pdf || { echo "missing resume"; exit 1; }
          grep -Fq 'Technical documentation' out/open-industrial-automation/index.html
          grep -Fq 'Mixing, dosing and CIP' out/open-industrial-automation/demo/index.html
          grep -Fq 'Engineering Studio' out/open-industrial-automation/studio/index.html
          echo "export verified"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live-oia:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for live verification
        run: npx playwright install --with-deps chromium

      - name: Wait for portfolio and all Open Industrial Automation routes
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            portfolio_status="$(curl --silent --show-error --location --output /tmp/portfolio-live.html --write-out '%{http_code}' "https://sajeevanveeriah.github.io/?release=${GITHUB_SHA}")"
            documentation_status="$(curl --silent --show-error --location --output /tmp/oia-live-documentation.html --write-out '%{http_code}' "$OIA_PUBLIC_BASE_URL/?release=${GITHUB_SHA}")"
            operator_status="$(curl --silent --show-error --location --output /tmp/oia-live-operator.html --write-out '%{http_code}' "$OIA_PUBLIC_BASE_URL/demo/?release=${GITHUB_SHA}")"
            studio_status="$(curl --silent --show-error --location --output /tmp/oia-live-studio.html --write-out '%{http_code}' "$OIA_PUBLIC_BASE_URL/studio/?release=${GITHUB_SHA}")"
            model_status="$(curl --silent --show-error --location --output /tmp/oia-live-model.json --write-out '%{http_code}' "$OIA_PUBLIC_BASE_URL/model.json?release=${GITHUB_SHA}")"
            if [ "$portfolio_status" = 200 ] && \
               [ "$documentation_status" = 200 ] && \
               [ "$operator_status" = 200 ] && \
               [ "$studio_status" = 200 ] && \
               [ "$model_status" = 200 ] && \
               grep -Fq 'Technical documentation' /tmp/oia-live-documentation.html && \
               grep -Fq 'Mixing, dosing and CIP' /tmp/oia-live-operator.html && \
               grep -Fq 'Engineering Studio' /tmp/oia-live-studio.html && \
               grep -Fq 'OIA-REF-001' /tmp/oia-live-model.json; then
              printf 'Live portfolio and OIA routes ready after attempt %s\n' "$attempt"
              exit 0
            fi
            printf 'Attempt %s: portfolio=%s documentation=%s operator=%s studio=%s model=%s\n' \
              "$attempt" "$portfolio_status" "$documentation_status" "$operator_status" "$studio_status" "$model_status"
            sleep 4
          done
          echo 'Portfolio or Open Industrial Automation public routes did not become ready in time' >&2
          exit 1

      - name: Run live Open Industrial Automation browser QA
        env:
          OIA_BASE_URL: ${{ env.OIA_PUBLIC_BASE_URL }}
        run: npm run qa:oia

      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-oia-qa-${{ github.sha }}
          path: /tmp/oia-qa
          if-no-files-found: warn
          retention-days: 14
