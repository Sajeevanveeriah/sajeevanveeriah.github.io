# Builds the static export, deploys it to GitHub Pages and verifies the public portfolio result.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Generate DOCX resume
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            python-docx==1.2.0 Pillow==12.3.0
          python scripts/generate-public-resume-docx.py

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Install browser for rendered QA
        run: npx playwright install --with-deps chromium

      - name: Run rendered portfolio QA
        run: npm run qa:browser

      - name: Upload pre-deployment portfolio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-deployment-portfolio-qa-${{ github.sha }}
          path: /tmp/portfolio-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Run Lighthouse quality gate
        run: npm run qa:lighthouse

      - name: Verify portfolio export and resume formats
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            index.html \
            404.html \
            .nojekyll \
            BingSiteAuth.xml \
            googlebcce96f6b520ab1f.html \
            robots.txt \
            sitemap.xml \
            favicon.png \
            work/index.html \
            about/index.html \
            notes/index.html \
            work/autonomous-navigation-rover/index.html \
            work/ataxia-assessment-device/index.html \
            work/swl-pricing-inventory-control/index.html \
            assets/Resume_Sajeevan_Veeriah.pdf \
            assets/Resume_Sajeevan_Veeriah.docx \
            assets/20260903-Robotics-Learning-Roadmap-Rev00.docx \
            assets/image/20260827-Sajeevan-Veeriah-SV-Logo-Rev00.webp; do
            test -s "out/$file" || { echo "missing or empty out/$file"; exit 1; }
          done
          unzip -t out/assets/Resume_Sajeevan_Veeriah.docx >/dev/null
          unzip -t out/assets/20260903-Robotics-Learning-Roadmap-Rev00.docx >/dev/null
          grep -Fq 'Different systems.' out/index.html
          grep -Fq 'Download resume' out/index.html
          grep -Fq 'Engineering approach' out/index.html
          echo 'portfolio export verified'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live-portfolio:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for portfolio routes, both resumes and exact monogram
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://sajeevanveeriah.github.io"
          routes=(
            "/"
            "/work/"
            "/work/autonomous-navigation-rover/"
            "/work/ataxia-assessment-device/"
            "/work/swl-pricing-inventory-control/"
          )

          for attempt in $(seq 1 90); do
            cache_key="${GITHUB_SHA}-${attempt}"
            route_failure=0
            for route in "${routes[@]}"; do
              route_key="$(printf '%s' "$route" | sed 's#^/##; s#/$##; s#/#-#g')"
              test -n "$route_key" || route_key='home'
              status="$(curl --silent --show-error --compressed --location \
                --header 'Cache-Control: no-cache' \
                --output "/tmp/portfolio-route-${route_key}.html" \
                --write-out '%{http_code}' \
                "$base_url$route?release=$cache_key")"
              if [ "$status" != 200 ]; then
                route_failure=1
              fi
            done

            pdf_status="$(curl --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --output /tmp/resume-live.pdf \
              --write-out '%{http_code}' \
              "$base_url/assets/Resume_Sajeevan_Veeriah.pdf?release=$cache_key")"
            docx_status="$(curl --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --output /tmp/resume-live.docx \
              --write-out '%{http_code}' \
              "$base_url/assets/Resume_Sajeevan_Veeriah.docx?release=$cache_key")"
            monogram_status="$(curl --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --output /tmp/portfolio-monogram-live.webp \
              --write-out '%{http_code}' \
              "$base_url/assets/image/20260827-Sajeevan-Veeriah-SV-Logo-Rev00.webp?release=$cache_key")"

            if [ "$route_failure" = 0 ] && \
               [ "$pdf_status" = 200 ] && \
               [ "$docx_status" = 200 ] && \
               [ "$monogram_status" = 200 ] && \
               grep -Fq 'Different systems.' /tmp/portfolio-route-home.html && \
               grep -Fq 'Download resume' /tmp/portfolio-route-home.html && \
               grep -Fq 'Engineering approach' /tmp/portfolio-route-home.html && \
               cmp --silent public/assets/Resume_Sajeevan_Veeriah.pdf /tmp/resume-live.pdf && \
               cmp --silent public/assets/image/20260827-Sajeevan-Veeriah-SV-Logo-Rev00.webp /tmp/portfolio-monogram-live.webp && \
               unzip -t /tmp/resume-live.docx >/dev/null; then
              python -c "from pathlib import Path; from zipfile import ZipFile; path=Path('/tmp/resume-live.docx'); assert path.stat().st_size >= 30000, 'Live DOCX resume is unexpectedly small'; document=ZipFile(path).read('word/document.xml').decode('utf-8'); required=('Farm Frites Australia','CONTRACT PENDING','Industrial IT Engineer'); assert all(phrase in document for phrase in required), 'Live DOCX missing required content'; print('Live DOCX package and Farm Frites content verified')"
              printf 'Live portfolio, PDF resume, DOCX resume and exact monogram verified after attempt %s\n' "$attempt"
              sha256sum \
                /tmp/portfolio-route-home.html \
                /tmp/resume-live.pdf \
                /tmp/resume-live.docx \
                /tmp/portfolio-monogram-live.webp
              exit 0
            fi

            printf 'Attempt %s: routes=%s pdf=%s docx=%s monogram=%s\n' \
              "$attempt" "$route_failure" "$pdf_status" "$docx_status" "$monogram_status"
            sleep 4
          done
          echo 'The public portfolio files did not match the deployed commit in time' >&2
          exit 1

      - name: Upload live portfolio verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-portfolio-qa-${{ github.sha }}
          path: |
            /tmp/portfolio-route-*.html
            /tmp/resume-live.pdf
            /tmp/resume-live.docx
            /tmp/portfolio-monogram-live.webp
          if-no-files-found: warn
          retention-days: 14
