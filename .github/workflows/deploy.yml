# Builds the static export and publishes it to GitHub Pages.
#
# Pages must be set to "Deploy from a GitHub Actions workflow" in repository
# settings before the first run; see README.md. There is no gh-pages branch:
# the artifact is uploaded and deployed directly.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs pages:write and id-token:write for deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a queued run finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Install browser for rendered QA
        run: npx playwright install --with-deps chromium

      - name: Run rendered browser QA
        run: npm run qa:browser

      - name: Upload rendered QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-rendered-qa
          path: /tmp/portfolio-qa
          if-no-files-found: error
          retention-days: 7

      - name: Run Lighthouse quality gate
        run: npm run qa:lighthouse

      # Guards the GitHub Pages constraints: without .nojekyll, Jekyll strips
      # the _next directory and the whole site 404s.
      - name: Verify export
        run: |
          set -e
          for f in index.html 404.html .nojekyll BingSiteAuth.xml \
                   googlebcce96f6b520ab1f.html robots.txt sitemap.xml favicon.svg; do
            test -e "out/$f" || { echo "missing out/$f"; exit 1; }
          done
          test -e out/assets/Resume_Sajeevan_Veeriah.pdf || { echo "missing resume"; exit 1; }
          echo "export verified"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
