name: OIA production release

on:
  pull_request:
    branches: [main]
    paths:
      - public/open-industrial-automation/**
      - desktop/**
      - scripts/qa-oia*.mjs
      - .github/workflows/oia-production-release.yml
  push:
    branches: [main]
    paths:
      - public/open-industrial-automation/**
      - desktop/**
      - scripts/qa-oia*.mjs
      - .github/workflows/oia-production-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oia-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: 2.2.0
  RELEASE_TAG: v2.2.0
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

jobs:
  validate:
    name: Validate complete suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static distribution
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify complete browser suite
        run: npm run qa:oia

      - name: Verify every focused product
        run: node scripts/qa-oia-products.mjs

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Verify desktop catalogue and security shell
        run: npm --prefix desktop run verify

      - name: Verify release source boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s public/open-industrial-automation/dub.css
          test -s public/open-industrial-automation/model.json
          test -s desktop/product-catalog.json
          test "$(node -e "console.log(require('./desktop/product-catalog.json').length)")" = 16
          test "$(find public/open-industrial-automation/products -mindepth 2 -maxdepth 2 -name index.html | wc -l)" = 15
          grep -Fq 'CHARGE_WATER' public/open-industrial-automation/app.js
          grep -Fq 'DOSE_CONCENTRATE' public/open-industrial-automation/app.js
          grep -Fq 'CIP_FINAL_RINSE' public/open-industrial-automation/app.js
          grep -Fq -- '--color-electric-blue: #2563eb' public/open-industrial-automation/dub.css
          if grep -Prn '[–—]' public/open-industrial-automation desktop scripts/qa-oia*.mjs; then
            echo 'Unicode dash found in release source' >&2
            exit 1
          fi
          if grep -Prin '\b(JAG|Ford|Invenio)\b' public/open-industrial-automation desktop; then
            echo 'Excluded organisation branding found in release source' >&2
            exit 1
          fi

      - name: Upload rendered verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oia-rendered-qa-${{ github.sha }}
          path: /tmp/oia-qa
          if-no-files-found: error
          retention-days: 30

  package-suite:
    name: Package complete suite - ${{ matrix.label }}
    needs: validate
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows-x64
            extensions: '*.exe'
          - os: macos-15-intel
            label: macOS-universal
            extensions: '*.dmg *.zip'
          - os: ubuntu-24.04
            label: Linux-x64
            extensions: '*.AppImage *.deb'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Verify desktop release model
        run: npm --prefix desktop run verify

      - name: Package complete suite
        run: npm --prefix desktop run package

      - name: Verify packaged suite files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          case "${RUNNER_OS}" in
            Windows) find desktop -path 'desktop/node_modules' -prune -o -type f -name '*.exe' -print0 | xargs -0 -I{} cp '{}' release-candidate/ ;;
            macOS) find desktop -path 'desktop/node_modules' -prune -o -type f \( -name '*.dmg' -o -name '*.zip' \) -print0 | xargs -0 -I{} cp '{}' release-candidate/ ;;
            Linux) find desktop -path 'desktop/node_modules' -prune -o -type f \( -name '*.AppImage' -o -name '*.deb' \) -print0 | xargs -0 -I{} cp '{}' release-candidate/ ;;
          esac
          test "$(find release-candidate -type f | wc -l)" -ge 2
          sha256sum release-candidate/* > release-candidate/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OIA-Suite-${{ matrix.label }}-${{ github.sha }}
          path: release-candidate
          if-no-files-found: error
          retention-days: 30

  package-products:
    name: Package all products - ${{ matrix.label }}
    needs: validate
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows-x64
          - os: macos-15-intel
            label: macOS-universal
          - os: ubuntu-24.04
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Verify desktop release model
        run: npm --prefix desktop run verify

      - name: Package complete suite and every focused product
        run: npm --prefix desktop run package:all

      - name: Collect and verify installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-products
          case "${RUNNER_OS}" in
            Windows) find desktop -path 'desktop/node_modules' -prune -o -type f -name '*.exe' -print0 | xargs -0 -I{} cp '{}' release-products/ ;;
            macOS) find desktop -path 'desktop/node_modules' -prune -o -type f \( -name '*.dmg' -o -name '*.zip' \) -print0 | xargs -0 -I{} cp '{}' release-products/ ;;
            Linux) find desktop -path 'desktop/node_modules' -prune -o -type f \( -name '*.AppImage' -o -name '*.deb' \) -print0 | xargs -0 -I{} cp '{}' release-products/ ;;
          esac
          count="$(find release-products -type f | wc -l)"
          test "$count" -ge 32 || { echo "Expected at least 32 installer artefacts, found $count" >&2; exit 1; }
          sha256sum release-products/* > release-products/SHA256SUMS-${{ matrix.label }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OIA-Products-${{ matrix.label }}-${{ github.sha }}
          path: release-products
          if-no-files-found: error
          retention-days: 90

  source-package:
    name: Build source and evidence package
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Build source distribution and SBOMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-source
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='out' \
            --exclude='.next' \
            --exclude='desktop/dist' \
            --exclude='desktop/release' \
            -czf release-source/20260902-Open-Industrial-Automation-Source-Rev00.tar.gz \
            public/open-industrial-automation desktop scripts/qa-oia.mjs scripts/qa-oia-lib.mjs scripts/qa-oia-tests.mjs scripts/qa-oia-products.mjs
          npm sbom --sbom-format spdx > release-source/20260902-Open-Industrial-Automation-Web-SBOM-Rev00.spdx.json
          npm --prefix desktop sbom --sbom-format spdx > release-source/20260902-Open-Industrial-Automation-Desktop-SBOM-Rev00.spdx.json
          cp public/open-industrial-automation/LICENSE release-source/LICENSE-Apache-2.0.txt
          cp public/open-industrial-automation/README.md release-source/README.md
          sha256sum release-source/* > release-source/SHA256SUMS-Source.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OIA-Source-${{ github.sha }}
          path: release-source
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish v2.2.0 release
    needs: [package-products, source-package]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: OIA-Products-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: OIA-Source-${{ github.sha }}
          path: release

      - name: Build consolidated checksum and manifest
        shell: bash
        run: |
          set -euo pipefail
          find release -maxdepth 1 -type f ! -name 'SHA256SUMS-*' -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
          node <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const files = fs.readdirSync('release').filter((name) => name !== 'release-manifest.json').sort()
          const records = files.map((name) => {
            const bytes = fs.readFileSync(`release/${name}`)
            return { name, bytes: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex') }
          })
          fs.writeFileSync('release/release-manifest.json', JSON.stringify({
            product: 'Open Industrial Automation',
            version: '2.2.0',
            commit: process.env.GITHUB_SHA,
            generatedAt: new Date().toISOString(),
            installerSigning: 'Unsigned community release',
            files: records,
          }, null, 2) + '\n')
          NODE
          test "$(find release -maxdepth 1 -type f | wc -l)" -ge 100

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title 'Open Industrial Automation 2.2.0' \
            --notes 'Production-distributable community software release. Includes the complete browser suite, 15 focused desktop products plus the complete suite for Windows, macOS and Linux, source package, SBOMs, checksums and release manifest. Installers are unsigned. Physical industrial deployment still requires site-specific controls, safety, cybersecurity, FAT, SAT and commissioning acceptance.' \
            release/*
