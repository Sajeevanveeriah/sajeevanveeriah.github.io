name: Repair OIA QA locator

on:
  push:
    branches:
      - saj/portfolio-premium-systems-20260902

permissions:
  contents: write

concurrency:
  group: oia-qa-locator-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Scope TEST-001 assertion to the validation table
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/qa-oia-tests.mjs')
          content = path.read_text(encoding='utf-8')
          old = "  const testRow = page.locator('tr', { hasText: 'TEST-001' })\n"
          new = "  const testRow = page.locator('tr', { hasText: 'TEST-001' }).filter({ hasText: 'FAT' }).first()\n"
          if old not in content:
              raise SystemExit('Expected TEST-001 locator was not found exactly once')
          if content.count(old) != 1:
              raise SystemExit('Expected TEST-001 locator was not unique')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY

      - name: Commit repair and remove this one-time workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/oia-qa-locator-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/qa-oia-tests.mjs
          git commit -m 'Scope OIA validation QA to the test register'
          git push origin HEAD:${GITHUB_REF_NAME}
