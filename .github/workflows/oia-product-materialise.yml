name: OIA product suite materialise

on:
  push:
    branches:
      - feat/oia-suite-v2-20260902
    paths:
      - .github/workflows/oia-product-materialise.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oia-suite-v2-20260902
          fetch-depth: 0

      - name: Reconstruct and verify release payload
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/oia-product-payload/part-*; do
            printf '%s ' "$file"
            stat -c '%s bytes' "$file"
            sha256sum "$file"
          done
          cat .github/oia-product-payload/part-* > /tmp/oia-product-suite-v2.2.0.tar.xz.b64
          stat -c 'Concatenated payload: %s bytes' /tmp/oia-product-suite-v2.2.0.tar.xz.b64
          sha256sum /tmp/oia-product-suite-v2.2.0.tar.xz.b64
          test "$(stat -c %s /tmp/oia-product-suite-v2.2.0.tar.xz.b64)" = "61272"
          printf '%s  %s\n' \
            'e0b53a1932abc7dbf528fb09752e19186bff744176f7fa1058214284ed2c4d79' \
            '/tmp/oia-product-suite-v2.2.0.tar.xz.b64' | sha256sum -c -
          base64 --decode /tmp/oia-product-suite-v2.2.0.tar.xz.b64 > /tmp/oia-product-suite-v2.2.0.tar.xz
          test "$(stat -c %s /tmp/oia-product-suite-v2.2.0.tar.xz)" = "45952"
          printf '%s  %s\n' \
            'b242e36f546088485eb06506148c94eed4d43985050b5d6e8d9ba4106b0c0e37' \
            '/tmp/oia-product-suite-v2.2.0.tar.xz' | sha256sum -c -
          xz --test /tmp/oia-product-suite-v2.2.0.tar.xz
          tar -tJf /tmp/oia-product-suite-v2.2.0.tar.xz > /tmp/oia-product-suite-files.txt
          test "$(wc -l < /tmp/oia-product-suite-files.txt)" -ge 40

      - name: Materialise product suite
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/oia-product-suite-v2.2.0.tar.xz -C .
          rm -rf .github/oia-product-payload
          rm -f \
            .github/workflows/oia-product-materialise.yml \
            .github/workflows/oia-source-export.yml \
            .github/workflows/oia-bootstrap.yml \
            public/open-industrial-automation/demo/app.js \
            public/open-industrial-automation/demo/styles.css \
            public/open-industrial-automation/studio/app.js \
            public/open-industrial-automation/studio/styles.css

      - name: Validate materialised source
        shell: bash
        run: |
          set -euo pipefail
          node --check public/open-industrial-automation/app.js
          node --check public/open-industrial-automation/data.js
          node --check public/open-industrial-automation/product-shell.js
          node --check public/open-industrial-automation/runtime-bootstrap.js
          node --check public/open-industrial-automation/sw.js
          node --check scripts/qa-oia-products.mjs
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/build.cjs
          node --check desktop/verify.cjs
          node desktop/verify.cjs
          python3 - <<'PY'
          from pathlib import Path
          import json
          required = [
              'desktop/package.json',
              'desktop/product-catalog.json',
              'public/open-industrial-automation/index.html',
              'public/open-industrial-automation/dub.css',
              'public/open-industrial-automation/product-shell.js',
              'public/open-industrial-automation/runtime-bootstrap.js',
              'public/open-industrial-automation/assets/oia-app-icon.png',
              'scripts/qa-oia-products.mjs',
              '.github/workflows/oia-product-quality.yml',
              '.github/workflows/oia-desktop.yml',
          ]
          for item in required:
              path = Path(item)
              assert path.is_file() and path.stat().st_size > 0, item
          catalog = json.loads(Path('desktop/product-catalog.json').read_text())
          products = catalog['products']
          assert len(products) == 16
          assert len({p['id'] for p in products}) == 16
          assert len({p['appId'] for p in products}) == 16
          for product in products:
              path = Path('public/open-industrial-automation/products') / product['id'] / 'index.html'
              assert path.is_file() and path.stat().st_size > 100, path
          PY
          if grep -Prn '[–—]' desktop public/open-industrial-automation scripts/qa-oia-products.mjs docs/superpowers/specs/20260902-Open-Industrial-Automation-Product-Suite-Design-Rev01.md docs/superpowers/plans/20260902-Open-Industrial-Automation-Product-Suite-Implementation-Plan-Rev01.md; then
            echo 'Unicode dash found in OIA product release' >&2
            exit 1
          fi
          if grep -Prin '\b(JAG|Ford|Invenio)\b' desktop public/open-industrial-automation; then
            echo 'Excluded organisation name found in public OIA product source' >&2
            exit 1
          fi

      - name: Commit materialised release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No product-suite changes found' >&2; exit 1; }
          git commit -m 'feat: add premium interconnected OIA product suite 2.2.0'
          git push origin HEAD:feat/oia-suite-v2-20260902
