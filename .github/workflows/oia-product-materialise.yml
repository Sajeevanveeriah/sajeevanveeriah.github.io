name: OIA product suite materialise

on:
  push:
    branches:
      - feat/oia-suite-v2-20260902
    paths:
      - .github/workflows/oia-product-materialise.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oia-product-suite-materialise
  cancel-in-progress: false

jobs:
  materialise:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oia-suite-v2-20260902
          fetch-depth: 0

      - name: Reconstruct and verify release payload
        shell: bash
        run: |
          set -euo pipefail
          files=(.github/oia-product-payload/part-*)
          test "${#files[@]}" = "22"
          cat "${files[@]}" > /tmp/oia-product-suite-v2.2.0.tar.xz.b64
          test "$(stat -c %s /tmp/oia-product-suite-v2.2.0.tar.xz.b64)" = "61272"
          printf '%s  %s\n' \
            'e0b53a1932abc7dbf528fb09752e19186bff744176f7fa1058214284ed2c4d79' \
            '/tmp/oia-product-suite-v2.2.0.tar.xz.b64' | sha256sum -c -
          base64 --decode /tmp/oia-product-suite-v2.2.0.tar.xz.b64 > /tmp/oia-product-suite-v2.2.0.tar.xz
          test "$(stat -c %s /tmp/oia-product-suite-v2.2.0.tar.xz)" = "45952"
          printf '%s  %s\n' \
            'b242e36f546088485eb06506148c94eed4d43985050b5d6e8d9ba4106b0c0e37' \
            '/tmp/oia-product-suite-v2.2.0.tar.xz' | sha256sum -c -
          xz --test /tmp/oia-product-suite-v2.2.0.tar.xz
          tar -tJf /tmp/oia-product-suite-v2.2.0.tar.xz > /tmp/oia-product-suite-files.txt
          test "$(wc -l < /tmp/oia-product-suite-files.txt)" = "40"

          icon_files=(.github/oia-icon-payload/part-*)
          test "${#icon_files[@]}" = "1"
          cat "${icon_files[@]}" > /tmp/oia-app-icon.png.b64
          test "$(stat -c %s /tmp/oia-app-icon.png.b64)" = "2928"
          printf '%s  %s\n' \
            '6704346b4304318c1d57016b5379de9b2bb7dd71d44a60493dfdc8f317ee4204' \
            '/tmp/oia-app-icon.png.b64' | sha256sum -c -
          base64 --decode /tmp/oia-app-icon.png.b64 > /tmp/oia-app-icon.png
          test "$(stat -c %s /tmp/oia-app-icon.png)" = "2196"
          printf '%s  %s\n' \
            '375af1d0ce97e30fea738632a8a321e8981ad535dc22cbecd4a2250fe63efaa4' \
            '/tmp/oia-app-icon.png' | sha256sum -c -
          file /tmp/oia-app-icon.png | grep -Fq 'PNG image data, 512 x 512'

      - name: Materialise product suite without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/oia-product-suite-v2.2.0.tar.xz -C .
          cp .github/workflows/oia-desktop.yml /tmp/oia-desktop.yml
          cp .github/workflows/oia-product-quality.yml /tmp/oia-product-quality.yml
          rm -f .github/workflows/oia-desktop.yml .github/workflows/oia-product-quality.yml
          mkdir -p desktop/assets public/open-industrial-automation/assets
          install -m 0644 /tmp/oia-app-icon.png desktop/assets/icon.png
          install -m 0644 /tmp/oia-app-icon.png public/open-industrial-automation/assets/oia-app-icon.png
          rm -rf \
            .github/oia-product-payload \
            .github/oia-icon-payload \
            .github/oia-product-bootstrap
          rm -f \
            public/open-industrial-automation/demo/app.js \
            public/open-industrial-automation/demo/styles.css \
            public/open-industrial-automation/studio/app.js \
            public/open-industrial-automation/studio/styles.css

      - name: Validate materialised source
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            desktop/package.json \
            desktop/product-catalog.json \
            desktop/assets/icon.png \
            desktop/main.cjs \
            desktop/preload.cjs \
            desktop/build.cjs \
            desktop/verify.cjs \
            public/open-industrial-automation/index.html \
            public/open-industrial-automation/dub.css \
            public/open-industrial-automation/product-shell.js \
            public/open-industrial-automation/runtime-bootstrap.js \
            public/open-industrial-automation/assets/oia-app-icon.png \
            public/open-industrial-automation/products/index.html \
            scripts/qa-oia-products.mjs \
            /tmp/oia-product-quality.yml \
            /tmp/oia-desktop.yml; do
            test -s "$file" || { echo "missing or empty $file" >&2; exit 1; }
          done
          node --check public/open-industrial-automation/app.js
          node --check public/open-industrial-automation/data.js
          node --check public/open-industrial-automation/product-shell.js
          node --check public/open-industrial-automation/runtime-bootstrap.js
          node --check public/open-industrial-automation/sw.js
          node --check scripts/qa-oia-products.mjs
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/build.cjs
          node --check desktop/verify.cjs
          node desktop/verify.cjs
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog = json.loads(Path('desktop/product-catalog.json').read_text())
          products = catalog['products']
          assert len(products) == 16
          assert len({p['id'] for p in products}) == 16
          assert len({p['appId'] for p in products}) == 16
          for product in products:
              if product['id'] == 'suite':
                  path = Path('public/open-industrial-automation/index.html')
              else:
                  path = Path('public/open-industrial-automation/products') / product['id'] / 'index.html'
              assert path.is_file() and path.stat().st_size > 100, path
          PY
          if grep -RniE '[–—]' desktop public/open-industrial-automation scripts/qa-oia-products.mjs docs/superpowers/specs/20260902-Open-Industrial-Automation-Product-Suite-Design-Rev01.md docs/superpowers/plans/20260902-Open-Industrial-Automation-Product-Suite-Implementation-Plan-Rev01.md; then
            echo 'Unicode dash found in OIA product release' >&2
            exit 1
          fi
          if grep -RniE '\b(JAG|Ford|Invenio)\b' desktop public/open-industrial-automation; then
            echo 'Excluded organisation name found in public OIA product source' >&2
            exit 1
          fi
          if grep -RniE '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,})' desktop public/open-industrial-automation; then
            echo 'Credential-like content found in OIA product source' >&2
            exit 1
          fi

      - name: Commit materialised release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --check
          git diff --cached --quiet && { echo 'No product-suite changes found' >&2; exit 1; }
          git commit -m 'feat: add premium interconnected OIA product suite 2.2.0 [oia-materialise]'
          git push origin HEAD:feat/oia-suite-v2-20260902
