name: Materialise corrected public resume

on:
  push:
    branches:
      - saj/portfolio-premium-systems-20260902

permissions:
  contents: write

concurrency:
  group: materialise-resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialise:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned resume generator dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.9 Pillow==12.3.0 pypdf==5.9.0

      - name: Generate and verify corrected resume
        run: python scripts/generate-public-resume.py --output public/assets/Resume_Sajeevan_Veeriah.pdf

      - name: Commit materialised resume when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- public/assets/Resume_Sajeevan_Veeriah.pdf; then
            echo 'Resume binary is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/Resume_Sajeevan_Veeriah.pdf
          git commit -m 'Materialise corrected public resume'
          git push origin HEAD:${GITHUB_REF_NAME}
