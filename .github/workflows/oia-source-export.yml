name: OIA source export

on:
  push:
    branches:
      - feat/oia-suite-v2-20260902
    paths:
      - .github/workflows/oia-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oia-suite-v2-20260902
          fetch-depth: 0

      - name: Verify source ref
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/oia-suite-v2-20260902"
          git status --short

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: oia-source-${{ github.sha }}
          path: |
            .
            !.git
            !node_modules
            !out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
