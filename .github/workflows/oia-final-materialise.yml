name: OIA final patch materialise

on:
  push:
    branches:
      - feat/oia-suite-v2-20260902
    paths:
      - .github/workflows/oia-final-materialise.yml
      - .github/oia-final-patch/**

permissions:
  contents: write

jobs:
  materialise:
    if: ${{ !contains(github.event.head_commit.message, '[oia-final-materialised]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oia-suite-v2-20260902
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify and extract final patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .github/oia-final-patch -maxdepth 1 -type f -name 'part-*' -printf '%f\n' | sort)
          test "${#parts[@]}" = 24 || { printf 'Expected 24 patch parts, found %s\n' "${#parts[@]}" >&2; exit 1; }
          : > /tmp/oia-final.tar.xz.b64
          for part in "${parts[@]}"; do cat ".github/oia-final-patch/$part" >> /tmp/oia-final.tar.xz.b64; done
          test "$(stat -c %s /tmp/oia-final.tar.xz.b64)" = 83628
          printf '%s  %s\n' \
            'fac5d2372f5094223f9625a05dbb58d775efd0966815dd9b7d51d7fe5b8a46a1' \
            '/tmp/oia-final.tar.xz.b64' | sha256sum -c -
          base64 --decode /tmp/oia-final.tar.xz.b64 > /tmp/oia-final.tar.xz
          test "$(stat -c %s /tmp/oia-final.tar.xz)" = 62720
          printf '%s  %s\n' \
            'ebfc4719b913531178785b9ff3e3acf5cdd3d791a8f0185e1f07b068119f73f3' \
            '/tmp/oia-final.tar.xz' | sha256sum -c -
          xz --test /tmp/oia-final.tar.xz
          rm -rf /tmp/oia-final
          mkdir -p /tmp/oia-final
          tar -xJf /tmp/oia-final.tar.xz -C /tmp/oia-final

          install -D -m 0644 /tmp/oia-final/desktop/main.cjs desktop/main.cjs
          install -D -m 0644 /tmp/oia-final/desktop/verify.cjs desktop/verify.cjs
          install -D -m 0644 /tmp/oia-final/public/open-industrial-automation/app.js public/open-industrial-automation/app.js
          install -D -m 0644 /tmp/oia-final/public/open-industrial-automation/data.js public/open-industrial-automation/data.js
          install -D -m 0644 /tmp/oia-final/public/open-industrial-automation/dub.css public/open-industrial-automation/dub.css
          install -D -m 0644 /tmp/oia-final/public/open-industrial-automation/model.json public/open-industrial-automation/model.json
          install -D -m 0644 /tmp/oia-final/public/open-industrial-automation/sw.js public/open-industrial-automation/sw.js
          install -D -m 0644 /tmp/oia-final/scripts/qa-oia-products.mjs scripts/qa-oia-products.mjs
          install -D -m 0644 /tmp/oia-final/scripts/qa-oia-tests.mjs scripts/qa-oia-tests.mjs

          rm -rf .github/oia-final-patch .github/oia-product-payload

      - name: Validate materialised source
        shell: bash
        run: |
          set -euo pipefail
          node --check public/open-industrial-automation/app.js
          node --check public/open-industrial-automation/data.js
          node --check public/open-industrial-automation/runtime-bootstrap.js
          node --check public/open-industrial-automation/product-shell.js
          node --check public/open-industrial-automation/sw.js
          node --check scripts/qa-oia-tests.mjs
          node --check scripts/qa-oia-products.mjs
          node --check desktop/main.cjs
          node --check desktop/verify.cjs
          node desktop/verify.cjs
          node <<'NODE'
          const fs = require('node:fs')
          for (const file of [
            'public/open-industrial-automation/model.json',
            'desktop/product-catalog.json',
            'desktop/package.json',
            'desktop/package-lock.json',
          ]) JSON.parse(fs.readFileSync(file, 'utf8'))
          NODE
          if grep -Prn '[–—]' public/open-industrial-automation desktop scripts/qa-oia*.mjs; then
            echo 'Unicode dash found in OIA release source' >&2
            exit 1
          fi
          if grep -Prin '\b(JAG|Ford|Invenio)\b' public/open-industrial-automation desktop; then
            echo 'Excluded organisation branding found in OIA release source' >&2
            exit 1
          fi

      - id: qa
        name: Build and run rendered QA
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
          npm run qa:oia
          node scripts/qa-oia-products.mjs

      - name: Upload materialisation QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oia-final-materialisation-qa-${{ github.sha }}
          path: /tmp/oia-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Commit materialised final patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No final patch changes found' >&2; exit 1; }
          git commit -m 'feat: materialise OIA product suite 2.2 [oia-final-materialised]'
          git push origin HEAD:feat/oia-suite-v2-20260902

      - name: Preserve rendered QA gate
        if: ${{ steps.qa.outcome != 'success' }}
        run: |
          echo 'Rendered QA failed after source materialisation.' >&2
          exit 1
