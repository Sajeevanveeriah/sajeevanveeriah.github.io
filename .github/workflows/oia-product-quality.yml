name: OIA product quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/open-industrial-automation/**'
      - 'desktop/**'
      - 'scripts/qa-oia-products.mjs'
      - '.github/workflows/oia-product-quality.yml'
  push:
    branches: [main]
    paths:
      - 'public/open-industrial-automation/**'
      - 'desktop/**'
      - 'scripts/qa-oia-products.mjs'
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oia-product-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product-quality:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install portfolio dependencies
        run: npm ci

      - name: Build portfolio and OIA export
        run: npm run build

      - name: Verify desktop product contracts
        run: node desktop/verify.cjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete OIA module QA
        run: npm run qa:oia

      - name: Run product and full-sequence QA
        run: node scripts/qa-oia-products.mjs

      - name: Verify product export
        shell: bash
        run: |
          set -euo pipefail
          for product in operations control hmi alarms historian performance integration mes materials assets quality security identity deployment migration; do
            test -s "out/open-industrial-automation/products/$product/index.html"
          done
          for file in \
            out/open-industrial-automation/dub.css \
            out/open-industrial-automation/runtime-bootstrap.js \
            out/open-industrial-automation/product-shell.js \
            out/open-industrial-automation/products/index.html; do
            test -s "$file"
          done
          grep -Fq 'data-theme="light"' out/open-industrial-automation/index.html
          grep -Fq 'dub.css' out/open-industrial-automation/index.html
          grep -Fq 'product-shell.js' out/open-industrial-automation/index.html
          echo "OIA product export verified"

      - name: Upload OIA product QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oia-product-qa-${{ github.sha }}
          path: /tmp/oia-qa
          if-no-files-found: warn
          retention-days: 30

  live-product-quality:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install portfolio dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete live OIA module QA
        env:
          OIA_BASE_URL: https://sajeevanveeriah.github.io/open-industrial-automation
        run: npm run qa:oia

      - name: Run live product and full-sequence QA
        env:
          OIA_BASE_URL: https://sajeevanveeriah.github.io/open-industrial-automation
        run: node scripts/qa-oia-products.mjs

      - name: Upload live OIA product QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oia-live-product-qa-${{ github.event.workflow_run.head_sha }}
          path: /tmp/oia-qa
          if-no-files-found: warn
          retention-days: 30
